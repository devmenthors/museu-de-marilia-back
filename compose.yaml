services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    minio:
        image: quay.io/minio/minio:latest
        container_name: minio
        ports:
            - "9000:9000"   # Porta da API S3
            - "9001:9001"   # Porta do Console Web
        environment:
            # FIXME: Mudar isso aqui
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        networks:
            - sail
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    # Isso provavelmente não deve existir em produção
    createbuckets:
        image: quay.io/minio/mc
        depends_on:
            minio:
                condition: service_healthy
        networks:
            - sail
        environment:
            MINIO_PUBLIC_BUCKET: '${MINIO_PUBLIC_BUCKET:-publico}'
            MINIO_PRIVATE_BUCKET: '${MINIO_PRIVATE_BUCKET:-privado}'

        entrypoint: >
            /bin/sh -c "
                until (/usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin); do
                    echo 'Aguardando o MinIO inicializar...';
                    sleep 2;
                done;

                /usr/bin/mc mb minio/$MINIO_PUBLIC_BUCKET;
                /usr/bin/mc anonymous set public minio/$MINIO_PUBLIC_BUCKET;

                /usr/bin/mc mb minio/$MINIO_PRIVATE_BUCKET;
                exit 0;
            "
networks:
    sail:
        driver: bridge
volumes:
    minio_data:

    sail-pgsql:
        driver: local
