services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    
    minio:
        image: ${AISTOR_IMAGE:-quay.io/minio/aistor/minio:latest}
        command: server /data --console-address ":9001" --license /minio.license
        hostname: minio
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
            MINIO_SERVER_URL: ${MINIO_ENDPOINT:-http://localhost:9000}
            MINIO_BROWSER_REDIRECT_URL: ${MINIO_PUBLIC_URL:-http://localhost:9001}
        ports:
            - "${AISTOR_API_PORT:-9000}:9000"
            - "${AISTOR_CONSOLE_PORT:-9001}:9001"
        volumes:
            - minio_data:/data
            - ${AISTOR_LICENSE_FILE:-./license/minio.license}:/minio.license:ro
        restart: unless-stopped
        stop_grace_period: 2m
        ulimits:
            nofile:
                soft: 1048576
                hard: 1048576
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        networks:
            - sail

    minio-init:
        image: ${MC_IMAGE:-quay.io/minio/mc:latest}
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
            PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-private}
            PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-public}
        entrypoint: ["/bin/sh"]
        command:
            - -ec
            - |
                ACCESS_KEY="$$MINIO_ROOT_USER"
                SECRET_KEY="$$MINIO_ROOT_PASSWORD"

                until mc alias set aistor http://minio:9000 "$$ACCESS_KEY" "$$SECRET_KEY"; do
                    echo "Waiting for AIStor to accept S3 credentials..."
                    sleep 3
                done

                for bucket in "$$PRIVATE_BUCKET" "$$PUBLIC_BUCKET"; do
                    mc mb --ignore-existing "aistor/$$bucket"
                    mc version enable "aistor/$$bucket"
                done

                mc anonymous set public "aistor/$$PUBLIC_BUCKET";
                mc admin info aistor
        restart: "no"
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    minio_data:

    sail-pgsql:
        driver: local
